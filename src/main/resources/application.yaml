spring:
  application:
    name: bug-report-service

  main:
    banner-mode: "off"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080

# Общий секрет межсервисных вызовов (заголовок X-Service-Token).
# Пустой — перенос адресов страниц из core-api выключен.
internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:}

core-api:
  base-url: ${CORE_API_URL:http://core-api:8080}
  connect-timeout: ${CORE_API_CONNECT_TIMEOUT:2s}
  read-timeout: ${CORE_API_READ_TIMEOUT:30s}
  # Перенос адресов страниц в репортах после смены адреса записи каталога.
  url-history:
    sync-interval: ${URL_HISTORY_SYNC_INTERVAL:PT10M}
    initial-delay: PT1M
    overlap: PT1H

# Настройки приложения
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  openapi:
    server-url: ${OPENAPI_SERVER_URL:}
  jwt:
    secret: ${JWT_SECRET}
  s3:
    endpoint: ${SPRING_CLOUD_AWS_S3_ENDPOINT}
    region: ${SPRING_CLOUD_AWS_S3_REGION}
    bucket: ${SPRING_CLOUD_AWS_S3_BUCKET}
    access-key: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY}
    secret-key: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY}
